<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful — Kombat AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
        .success-container {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }
        .success-card {
            background: var(--surface);
            padding: 4rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            max-width: 600px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .success-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: var(--brand-gradient);
            z-index: -1;
            border-radius: 25px;
            opacity: 0.1;
        }
        .success-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }
        .success-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .success-msg {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body style="padding-top: 72px;">
    <!-- Navbar Slot -->
    <div id="navbar-slot"></div>

    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">✨ ✓ ✨</div>
            <h1 class="success-title">Payment Successful!</h1>
            <p class="success-msg">Welcome to the future of AI. Your subscription has been successfully processed, and your account has been upgraded.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="chat.html" class="btn btn-primary btn-lg">Start Chatting</a>
                <a href="settings.html" class="btn btn-outline btn-lg">Go to Settings</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/models.js"></script>
    <script src="js/smartRouter.js"></script>
    <script src="js/auth.js"></script><script src="js/components.js"></script>
    <script>
        // Confetti effect
        const colors = ['#6366f1', '#a855f7', '#ec4899', '#22c55e', '#f59e0b'];
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = -10 + 'px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(confetti);
            
            setTimeout(() => { confetti.remove(); }, 5000);
        }
    </script>
</body>
</html>
